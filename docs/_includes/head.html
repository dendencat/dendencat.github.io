<meta charset="utf-8">
{% if page.csp %}<meta http-equiv="Content-Security-Policy" content="{{ page.csp | escape }}">
{% endif %}<meta name="viewport" content="width=device-width, initial-scale=1">
{% if page.robots %}<meta name="robots" content="{{ page.robots | escape }}">
{% endif %}
<meta name="color-scheme" content="light dark">
<title>{% if page.title %}{{ page.title | escape }} | {% endif %}{{ site.title | escape }}</title>
<meta name="description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 | escape }}">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
{% for css in page.extra_css %}<link rel="stylesheet" href="{{ css | relative_url }}">
{% endfor %}
<link rel="canonical" href="{{ page.url | absolute_url }}">
{% feed_meta %}
