<!DOCTYPE html>
<html lang="{{ site.lang | default: 'ja' }}">
<head>
{% include head.html %}
</head>
<body>
<header class="site-header">
  <div class="wrap nav">
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>
    <nav>
      <a href="{{ '/' | relative_url }}">Profile</a>
      <a href="{{ '/blog/' | relative_url }}">Blog</a>
      <a href="https://github.com/{{ site.github_username }}">GitHub</a>
    </nav>
  </div>
</header>
<main class="wrap">
{{ content }}
</main>
<footer class="site-footer">
  <div class="wrap">&copy; {{ 'now' | date: '%Y' }} {{ site.title | escape }} · <a href="{{ '/feed.xml' | relative_url }}">RSS</a></div>
</footer>
</body>
</html>
